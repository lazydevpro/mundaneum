name = "mundaneum"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# One origin for everything: the built app is served as static assets, and
# any path that isn't an asset (/anthropic, /gemini, /xai, /unfurl, /drop/*,
# /health) falls through to the worker script.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Secrets (set with `wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY, GEMINI_API_KEY, XAI_API_KEY
# The app probes /health and only offers in-page agents that have keys.

# One Durable Object per board: the phone-drop slot needs strong consistency
# (worker isolates don't share memory). SQLite backend = available free tier.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "BoardRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardRoom"]
